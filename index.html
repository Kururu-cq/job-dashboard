<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">TY</div><div class="brand-copy"><h1>2027 求职雷达</h1><small>个人版 · V2</small></div></div>
  <nav class="nav">

    <button data-view="jobs"><span class="ico">▦</span><span class="nav-text">岗位库</span></button>
    <button data-view="pipeline"><span class="ico">⇢</span><span class="nav-text">投递进度</span></button>
    <button data-view="calendar"><span class="ico">◫</span><span class="nav-text">截止日历</span></button>
    <button data-view="rules"><span class="ico">⚙</span><span class="nav-text">我的规则</span></button>
  </nav>
  <div class="sidebar-foot">自动岗位事实与个人操作分离。你的状态、备注和手动新增岗位只保存在浏览器本地。</div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="title"><h2 id="viewTitle">今日求职看板</h2><p id="todayText"></p></div>
    <div class="actions"><button class="btn" id="exportBtn">导出个人备份</button><button class="btn" id="importBtn">导入个人备份</button><input id="importFile" type="file" accept="application/json" hidden><button class="btn primary" id="addBtn">+ 我自己加岗位</button></div>
  </div>
  <div class="syncbar"><span id="syncBadge" class="badge gray">正在读取岗位源</span><span id="syncText" class="muted">jobs.json</span><span class="spacer"></span><button class="btn" id="refreshBtn">刷新自动岗位</button></div>

  <section id="dashboard" class="view active">
    <div class="grid kpis" id="kpis"></div>
    <div class="grid two">
      <div class="card section"><div class="section-head"><h3>优先行动</h3><span class="muted" style="font-size:12px">截止 + 地域 + 推荐度</span></div><div id="urgentList" class="urgent-list"></div></div>
      <div class="card section"><h3>当前策略</h3><div id="strategySummary" class="rule-list"></div></div>
    </div>
    <div class="card section" style="margin-top:16px"><div class="section-head"><h3>最近操作</h3><span class="muted" style="font-size:12px">你的状态更新与手动新增</span></div><div id="activityList" class="activity-list"></div></div>
  </section>

  <section id="jobs" class="view">
    <div class="toolbar"><input id="searchInput" placeholder="搜索公司、岗位、地点、专业、备注…"><select id="statusFilter"><option value="">全部状态</option></select><select id="regionFilter"><option value="">全部地域</option><option value="重庆">重庆</option><option value="成都武汉长沙">成都 / 武汉 / 长沙</option><option value="四川湖北湖南其他">川 / 鄂 / 湘其他</option></select><select id="sourceFilter"><option value="">全部来源</option><option value="自动">自动雷达</option><option value="手动">我自己加的</option></select><select id="scoreFilter"><option value="0">全部推荐度</option><option value="8">8分以上</option><option value="7">7分以上</option><option value="6">6分以上</option></select><select id="deadlineFilter"><option value="0">全部截止</option><option value="3">3天内</option><option value="7">7天内</option><option value="14">14天内</option></select></div>
    <div class="card table-wrap"><table class="jobs-table"><thead><tr><th>公司 / 岗位</th><th>地点</th><th>地域层级</th><th>专业要求</th><th>学历</th><th>院校门槛</th><th>截止</th><th>推荐</th><th>状态</th><th>来源</th></tr></thead><tbody id="jobsBody"></tbody></table></div>
  </section>

  <section id="pipeline" class="view"><div id="pipelineBoard" class="pipeline"></div></section>
  <section id="calendar" class="view"><div id="calendarList" class="calendar"></div></section>
  <section id="rules" class="view"><div class="grid profile-grid"><div class="card rule-box"><h3>个人档案</h3><div id="profileCards" class="rule-list"></div><div class="source-note" style="margin-top:14px"><b>数据规则：</b>公开岗位由自动雷达维护；你的状态/备注、投递日期和手动岗位由你维护，自动刷新不会覆盖。</div></div><div class="card rule-box"><h3>筛选规则</h3><textarea id="rulesText"></textarea><div class="modal-actions"><button class="btn primary" id="saveRules">保存个人规则</button></div></div></div></section>
</main>
</div>

<div class="modal" id="manualModal"><div class="modal-card"><div class="modal-head"><h3 id="manualTitle">我自己加岗位</h3><button class="close" data-close-manual>×</button></div><form id="manualForm"><input id="manualId" type="hidden"><div class="form-grid">
  <div class="field"><label>公司</label><input id="mCompany" required></div><div class="field"><label>岗位</label><input id="mRole" required></div>
  <div class="field"><label>地点</label><input id="mLocation" placeholder="重庆 / 成都 / 武汉…"></div><div class="field"><label>地域层级</label><select id="mRegion"><option>重庆</option><option>成都武汉长沙</option><option>四川湖北湖南其他</option><option>其他 / 待定</option></select></div>
  <div class="field"><label>状态</label><select id="mStatus"></select></div><div class="field"><label>推荐度 0-10</label><input id="mScore" type="number" min="0" max="10" step="0.5" value="7"></div>
  <div class="field"><label>专业要求</label><input id="mMajor"></div><div class="field"><label>学历要求</label><input id="mDegree"></div>
  <div class="field"><label>院校门槛</label><input id="mSchool"></div><div class="field"><label>截止日期</label><input id="mDeadline" type="datetime-local"></div>
  <div class="field full"><label>官网 / 网申</label><input id="mUrl" type="url" placeholder="https://..."></div>
  <div class="field full"><label>为什么值得看</label><textarea id="mReason"></textarea></div><div class="field full"><label>风险 / 排除原因</label><textarea id="mRisk"></textarea></div>
  <div class="field full"><label>我的备注</label><textarea id="mNotes"></textarea></div>
</div><div class="modal-actions"><button type="button" class="btn danger" id="manualDelete" style="margin-right:auto;display:none">删除</button><button type="button" class="btn" data-close-manual>取消</button><button class="btn primary" type="submit">保存</button></div></form></div></div>

<div class="modal" id="detailModal"><div class="modal-card"><div class="modal-head"><h3 id="detailTitle"></h3><button class="close" data-close-detail>×</button></div><div id="detailContent"></div><div class="modal-actions"><button class="btn" data-close-detail>关闭</button><button class="btn" id="editManualFromDetail" style="display:none">编辑完整岗位</button></div></div></div>

function renderAll(){renderToday();renderKpis();renderUrgent();renderStrategy();renderActivity();renderJobs();renderPipeline();renderCalendar();renderRules()}
function renderToday(){document.getElementById('todayText').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+' · 个人状态仅保存在你的浏览器'}
function renderKpis(){const active=jobs.filter(j=>!['拒绝','排除'].includes(j.status));const applied=jobs.filter(j=>['已投','测评','笔试','面试','Offer'].includes(j.status)).length;const urgent=jobs.filter(j=>{const n=daysLeft(j.deadline);return n!==null&&n>=0&&n<=7&&!['拒绝','排除'].includes(j.status)}).length;const manual=jobs.filter(j=>j.source==='手动').length;document.getElementById('kpis').innerHTML=[['在跟岗位',active.length,'自动 + 手动'],['已投递',applied,'含测评 / 笔面'],['7天内截止',urgent,'优先处理'],['我自己添加',manual,'个人岗位']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="num">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('')}
function renderUrgent(){let arr=jobs.filter(j=>!['拒绝','排除','Offer'].includes(j.status)).map(j=>({...j,left:daysLeft(j.deadline)})).filter(j=>j.left===null||j.left>=0).sort((a,b)=>{const ad=a.left===null?999:a.left,bd=b.left===null?999:b.left;return ad-bd||regionRank(a.region)-regionRank(b.region)||b.score-a.score}).slice(0,7);document.getElementById('urgentList').innerHTML=arr.length?arr.map(j=>{const u=urgency(j.deadline);return `<div class="row-card" onclick="showDetail('${j.id}')"><div><div class="row-title">${esc(j.company)} · ${esc(j.role)}</div><div class="row-meta"><span>${esc(j.location)}</span>${badgeSource(j.source)}${badgeStatus(j.status)}<span class="badge ${u.cls}">${u.text}</span></div></div><div class="score">${j.score}<small>/10</small></div></div>`}).join(''):'<div class="empty">暂无待行动岗位</div>'}
function renderStrategy(){const items=[['地域','重庆 > 成都/武汉/长沙 > 四川/湖北/湖南其他'],['核心排序','现实录用可能 > 地域 > 平台发展 > 专业匹配'],['个人操作','状态、备注、投递时间由你自己维护'],['自动更新','公司/岗位/硬门槛/截止等事实字段由岗位源刷新']];document.getElementById('strategySummary').innerHTML=items.map(x=>`<div class="rule-item"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}
function renderActivity(){document.getElementById('activityList').innerHTML=[...(personal.activities||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,7).map(a=>`<div class="row-card" style="cursor:default"><div><div class="row-title">${esc(a.text)}</div><div class="row-meta"><span>${esc(a.date)}</span></div></div></div>`).join('')||'<div class="empty">暂无个人操作</div>'}
function renderJobs(){const q=document.getElementById('searchInput').value.toLowerCase();const sf=document.getElementById('statusFilter').value;const rf=document.getElementById('regionFilter').value;const src=document.getElementById('sourceFilter').value;const score=+document.getElementById('scoreFilter').value;const df=+document.getElementById('deadlineFilter').value;let arr=jobs.filter(j=>{const hay=[j.company,j.role,j.location,j.region,j.major,j.reason,j.risk,j.notes].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(sf&&j.status!==sf)return false;if(rf&&j.region!==rf)return false;if(src&&j.source!==src)return false;if(score&&j.score<score)return false;if(df){const n=daysLeft(j.deadline);if(n===null||n<0||n>df)return false}return true}).sort((a,b)=>regionRank(a.region)-regionRank(b.region)||b.score-a.score);document.getElementById('jobsBody').innerHTML=arr.length?arr.map(j=>{const u=urgency(j.deadline);const gate=(j.schoolGate||'').includes('不满足')?'red':(j.schoolGate||'').includes('风险')||(j.schoolGate||'').includes('待核验')?'amber':'green';return `<tr onclick="showDetail('${j.id}')" style="cursor:pointer"><td><div class="company">${esc(j.company)}</div><div class="muted" style="font-size:12px;margin-top:4px">${esc(j.role)}</div></td><td>${esc(j.location)}</td><td><span class="badge ${regionRank(j.region)===1?'blue':regionRank(j.region)===2?'purple':'gray'}">${esc(j.region)}</span></td><td>${esc(j.major)}</td><td>${esc(j.degree)}</td><td><span class="badge ${gate}">${esc(j.schoolGate||'未填写')}</span></td><td><span class="badge ${u.cls}">${j.deadline?fmtDate(j.deadline):'未明确'}</span></td><td><b>${j.score}</b>/10</td><td>${badgeStatus(j.status)}</td><td>${badgeSource(j.source)}</td></tr>`}).join(''):'<tr><td colspan="10"><div class="empty">没有匹配的岗位</div></td></tr>'}
function renderPipeline(){const g={'待投':[],'已投':[],'测评/笔试':[],'面试':[],'Offer':[]};jobs.forEach(j=>{if(j.status==='待投'||j.status==='冲刺')g['待投'].push(j);else if(j.status==='已投')g['已投'].push(j);else if(['测评','笔试'].includes(j.status))g['测评/笔试'].push(j);else if(j.status==='面试')g['面试'].push(j);else if(j.status==='Offer')g['Offer'].push(j)});document.getElementById('pipelineBoard').innerHTML=PIPELINE.map(k=>`<div class="lane"><h4><span>${k}</span><span class="badge gray">${g[k].length}</span></h4>${g[k].map(j=>`<div class="job-card" onclick="showDetail('${j.id}')"><div class="name">${esc(j.company)}</div><div class="role">${esc(j.role)}</div><div class="meta"><span>${esc(j.location)} · ${j.source}</span><span>${j.score}/10</span></div></div>`).join('')||'<div class="muted" style="font-size:12px;padding:8px">暂无</div>'}</div>`).join('')}
function renderCalendar(){const arr=jobs.filter(j=>j.deadline&&!['拒绝','排除'].includes(j.status)).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));const map={};arr.forEach(j=>{const key=new Date(j.deadline).toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'});(map[key]??=[]).push(j)});document.getElementById('calendarList').innerHTML=arr.length?Object.entries(map).map(([date,items])=>{const left=daysLeft(items[0].deadline);return `<div class="date-group"><div class="date-label">${date}<small>${left<0?'已截止':left===0?'今天':`还有 ${left} 天`}</small></div><div class="date-jobs">${items.map(j=>`<div class="row-card" onclick="showDetail('${j.id}')"><div><div class="row-title">${esc(j.company)} · ${esc(j.role)}</div><div class="row-meta"><span>${esc(j.location)}</span>${badgeSource(j.source)}${badgeStatus(j.status)}</div></div><div class="score">${j.score}<small>/10</small></div></div>`).join('')}</div></div>`}).join(''):'<div class="empty">暂无明确截止日期</div>'}
function renderRules(){const p=personal.profile;document.getElementById('profileCards').innerHTML=[['本科',p.bachelor],['硕士',p.master],['地域',p.region],['求职策略',p.strategy]].map(x=>`<div class="rule-item"><b>${x[0]}</b><span>${esc(x[1])}</span></div>`).join('');document.getElementById('rulesText').value=personal.rules||DEFAULT_RULES}
function addActivity(text){(personal.activities??=[]).push({date:new Date().toISOString().slice(0,10),text})}
function updateOverride(id,status,notes,appliedAt){personal.overrides[id]={...(personal.overrides[id]||{}),status,personalNotes:notes,appliedAt,updatedAt:new Date().toISOString()};const j=jobs.find(x=>x.id===id);addActivity(`更新状态：${j?.company||''} · ${j?.role||''} → ${status}`);savePersonal()}
function showDetail(id){const j=jobs.find(x=>x.id===id);if(!j)return;selectedId=id;document.getElementById('detailTitle').textContent=j.company+' · '+j.role;const u=urgency(j.deadline);const sourceLinks=(j.sourceUrls||[]).map(x=>`<div><a class="link" href="${esc(x)}" target="_blank" rel="noopener">${esc(x)}</a></div>`).join('');document.getElementById('detailContent').innerHTML=`<div class="detail-grid"><div class="detail-cell"><span>来源</span>${badgeSource(j.source)}</div><div class="detail-cell"><span>个人状态</span>${badgeStatus(j.status)}</div><div class="detail-cell"><span>推荐度</span><b>${j.score}/10</b></div><div class="detail-cell"><span>地域</span>${esc(j.location)} · ${esc(j.region)}</div><div class="detail-cell"><span>截止</span><span class="badge ${u.cls}">${j.deadline?fmtDate(j.deadline):'未明确'}</span></div><div class="detail-cell"><span>专业要求</span>${esc(j.major||'—')}</div><div class="detail-cell"><span>学历</span>${esc(j.degree||'—')}</div><div class="detail-cell"><span>院校门槛</span>${esc(j.schoolGate||'—')}</div></div><div class="detail-section"><h4>为什么值得看</h4><p>${esc(j.reason||'—')}</p></div><div class="detail-section"><h4>风险 / 排除原因</h4><p>${esc(j.risk||'—')}</p></div>${j.source==='自动'?`<div class="detail-section"><h4>自动核验信息</h4><p>核验状态：${esc(j.verified||'—')} · 上次核验：${esc(j.lastVerified||'—')}<br>${esc(j.changeSummary||'')}</p></div>`:''}${j.url?`<div class="detail-section"><h4>官网 / 网申</h4><p><a class="link" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.url)}</a></p>${sourceLinks}</div>`:''}<div class="personal-panel"><h4>我的操作</h4><div class="personal-row"><label>投递状态</label><select id="detailStatus">${STATUS.map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="personal-row"><label>投递 / 状态日期</label><input id="detailAppliedAt" type="date" value="${esc(j.appliedAt||'')}"></div><div class="personal-row"><label>我的备注</label><textarea id="detailNotes" placeholder="例如：已投哪个志愿、HR联系、面试时间、薪资信息…">${esc(j.notes||'')}</textarea></div><div class="modal-actions"><button class="btn primary" onclick="saveDetailPersonal('${j.id}')">保存我的操作</button></div></div>`;document.getElementById('editManualFromDetail').style.display=j.source==='手动'?'inline-block':'none';document.getElementById('detailModal').classList.add('show')}
function saveDetailPersonal(id){const j=jobs.find(x=>x.id===id);if(!j)return;const status=document.getElementById('detailStatus').value,notes=document.getElementById('detailNotes').value,appliedAt=document.getElementById('detailAppliedAt').value;if(j.source==='自动'){updateOverride(id,status,notes,appliedAt)}else{const idx=personal.customJobs.findIndex(x=>x.id===id);if(idx>=0){personal.customJobs[idx].status=status;personal.customJobs[idx].notes=notes;personal.customJobs[idx].appliedAt=appliedAt;addActivity(`更新状态：${j.company} · ${j.role} → ${status}`);savePersonal()}}document.getElementById('detailModal').classList.remove('show')}
function openManual(j=null){document.getElementById('manualTitle').textContent=j?'编辑我添加的岗位':'我自己加岗位';document.getElementById('manualId').value=j?.id||'';mCompany.value=j?.company||'';mRole.value=j?.role||'';mLocation.value=j?.location||'';mRegion.value=j?.region||'重庆';mStatus.value=j?.status||'待投';mScore.value=j?.score??7;mMajor.value=j?.major||'';mDegree.value=j?.degree||'';mSchool.value=j?.schoolGate||'';mDeadline.value=j?.deadline?String(j.deadline).slice(0,16):'';mUrl.value=j?.url||'';mReason.value=j?.reason||'';mRisk.value=j?.risk||'';mNotes.value=j?.notes||'';document.getElementById('manualDelete').style.display=j?'inline-block':'none';document.getElementById('manualModal').classList.add('show')}
function switchView(v){currentView=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.getElementById('viewTitle').textContent={dashboard:'今日求职看板',jobs:'岗位总库',pipeline:'投递进度',calendar:'截止日历',rules:'我的规则'}[v]}
STATUS.forEach(s=>{document.getElementById('mStatus').insertAdjacentHTML('beforeend',`<option>${s}</option>`);document.getElementById('statusFilter').insertAdjacentHTML('beforeend',`<option>${s}</option>`)});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));['searchInput','statusFilter','regionFilter','sourceFilter','scoreFilter','deadlineFilter'].forEach(id=>document.getElementById(id).addEventListener('input',renderJobs));
document.getElementById('addBtn').onclick=()=>openManual();document.getElementById('refreshBtn').onclick=()=>loadPublic();document.querySelectorAll('[data-close-manual]').forEach(x=>x.onclick=()=>document.getElementById('manualModal').classList.remove('show'));document.querySelectorAll('[data-close-detail]').forEach(x=>x.onclick=()=>document.getElementById('detailModal').classList.remove('show'));
document.getElementById('editManualFromDetail').onclick=()=>{const j=jobs.find(x=>x.id===selectedId&&x.source==='手动');if(j){document.getElementById('detailModal').classList.remove('show');openManual(j)}};
document.getElementById('manualForm').onsubmit=e=>{e.preventDefault();const id=manualId.value||'manual-'+Date.now();const obj={id,company:mCompany.value.trim(),role:mRole.value.trim(),location:mLocation.value.trim(),region:mRegion.value,status:mStatus.value,score:+mScore.value||0,major:mMajor.value.trim(),degree:mDegree.value.trim(),schoolGate:mSchool.value.trim(),deadline:mDeadline.value,url:mUrl.value.trim(),reason:mReason.value.trim(),risk:mRisk.value.trim(),notes:mNotes.value.trim(),appliedAt:'',verified:'我自己添加',lastVerified:new Date().toISOString().slice(0,10)};const idx=personal.customJobs.findIndex(x=>x.id===id);if(idx>=0){obj.appliedAt=personal.customJobs[idx].appliedAt||'';personal.customJobs[idx]=obj;addActivity(`编辑手动岗位：${obj.company} · ${obj.role}`)}else{personal.customJobs.push(obj);addActivity(`手动新增岗位：${obj.company} · ${obj.role}`)}document.getElementById('manualModal').classList.remove('show');savePersonal()};
document.getElementById('manualDelete').onclick=()=>{const id=manualId.value;const j=personal.customJobs.find(x=>x.id===id);if(j&&confirm(`确认删除「${j.company} · ${j.role}」？`)){personal.customJobs=personal.customJobs.filter(x=>x.id!==id);addActivity(`删除手动岗位：${j.company} · ${j.role}`);document.getElementById('manualModal').classList.remove('show');savePersonal()}};
document.getElementById('saveRules').onclick=()=>{personal.rules=rulesText.value;addActivity('更新个人求职筛选规则');savePersonal();alert('已保存。自动岗位刷新不会覆盖你的规则。')};
document.getElementById('exportBtn').onclick=()=>{const payload={schema_version:2,exported_at:new Date().toISOString(),personal};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tao_job_personal_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('importBtn').onclick=()=>importFile.click();document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.personal)throw new Error('不是 V2 个人备份');personal=d.personal;savePersonal();alert('个人数据导入成功')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};
window.showDetail=showDetail;window.saveDetailPersonal=saveDetailPersonal;
mergeJobs();renderAll();loadPublic(true);
</script>
</body>
</html>
