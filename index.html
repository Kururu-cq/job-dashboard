<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2027 求职雷达 · Tao</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#fff;--text:#142033;--muted:#6f7b8e;--line:#e5eaf1;
  --brand:#276ef1;--green:#15945c;--amber:#c98700;--red:#d34242;--purple:#7554d6;
  --slate:#55657a;--shadow:0 10px 30px rgba(34,54,86,.08);--radius:18px
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:#0f1b2d;color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 24px}
.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#4e8dfc,#73b0ff);display:grid;place-items:center;font-weight:800}
.brand h1{font-size:17px;margin:0}.brand small{color:#9cb0cb}
.nav{display:grid;gap:8px}
.nav button{border:0;background:transparent;color:#b9c7db;text-align:left;padding:12px 13px;border-radius:12px;cursor:pointer}
.nav button:hover,.nav button.active{background:#1d2b40;color:#fff}.nav .ico{display:inline-block;width:24px}
.sidebar-foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8ea2bd;line-height:1.6}
.main{padding:26px 30px 40px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.title h2{margin:0;font-size:26px}.title p{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:11px;cursor:pointer}
.btn:hover{box-shadow:0 4px 14px rgba(37,60,92,.08)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--red)}.btn.update{border-color:#b8cdf7;color:#174ea6;background:#f5f8ff}
.syncbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 13px;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:14px}
.syncbar .spacer{flex:1}.view{display:none}.view.active{display:block}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:19px}.kpi .label{color:var(--muted);font-size:13px}.kpi .num{font-size:30px;font-weight:800;margin-top:8px}.kpi .hint{font-size:12px;color:var(--muted);margin-top:5px}
.two{grid-template-columns:1.25fr .75fr}.section{padding:20px}.section h3{margin:0 0 14px;font-size:17px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-head h3{margin:0}
.urgent-list,.activity-list{display:grid;gap:10px}
.row-card{border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;cursor:pointer}
.row-card:hover{border-color:#c9d6e8}.row-title{font-weight:700}.row-meta{color:var(--muted);font-size:12px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2f7;color:var(--slate);white-space:nowrap}
.badge.red{background:#ffeded;color:#b83232}.badge.amber{background:#fff3d8;color:#9a6800}.badge.green{background:#eaf8f1;color:#13794d}
.badge.blue{background:#eaf1ff;color:#265fbd}.badge.purple{background:#f0ebff;color:#6544c6}.badge.gray{background:#eef1f4;color:#596675}.badge.cyan{background:#e9f8fb;color:#177487}
.score{font-weight:800;font-size:16px}.score small{font-weight:500;color:var(--muted);font-size:11px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;min-height:40px}
.toolbar input{min-width:250px;flex:1}.table-wrap{overflow:auto}.jobs-table{width:100%;border-collapse:separate;border-spacing:0;min-width:1200px}
.jobs-table th,.jobs-table td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.jobs-table th{font-size:12px;color:var(--muted);font-weight:700;background:#fafbfd;position:sticky;top:0}.jobs-table tr:hover td{background:#fbfdff}.jobs-table .company{font-weight:700}
.muted{color:var(--muted)}.link{color:var(--brand);text-decoration:none}.link:hover{text-decoration:underline}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow:auto;padding-bottom:6px}
.lane{background:#edf1f6;border-radius:16px;padding:12px;min-height:420px}.lane h4{margin:2px 2px 12px;font-size:14px;display:flex;justify-content:space-between}
.job-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer;box-shadow:0 6px 16px rgba(30,50,80,.05)}
.job-card:hover{transform:translateY(-1px)}.job-card .name{font-weight:700}.job-card .role{font-size:13px;margin-top:5px}.job-card .meta{font-size:11px;color:var(--muted);margin-top:9px;display:flex;justify-content:space-between;gap:8px}
.calendar{display:grid;gap:14px}.date-group{display:grid;grid-template-columns:140px 1fr;gap:14px}.date-label{font-weight:800}.date-label small{display:block;font-weight:500;color:var(--muted);margin-top:5px}.date-jobs{display:grid;gap:9px}
.profile-grid{grid-template-columns:.9fr 1.1fr}.rule-box{padding:20px}.rule-box h3{margin-top:0}.rule-list{display:grid;gap:10px}.rule-item{padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}
.rule-item b{display:block;margin-bottom:4px}.rule-item span{font-size:13px;color:var(--muted)}
.rule-box textarea{width:100%;min-height:330px;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.65;resize:vertical;background:#fbfcfe}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #ced7e4;border-radius:14px;background:#fbfcfe}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.46);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}
.modal-card{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.24)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h3{margin:0}.close{border:0;background:#eef2f6;border-radius:10px;width:34px;height:34px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff}.field textarea{min-height:90px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.detail-cell{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.detail-cell span:first-child{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.detail-section{margin-top:16px}.detail-section h4{margin:0 0 7px;font-size:14px}.detail-section p{margin:0;line-height:1.65;color:#3d495b}
.personal-panel{margin-top:18px;padding:14px;border:1px solid #d8e4f7;background:#f6f9ff;border-radius:14px}.personal-panel h4{margin:0 0 10px}
.personal-row{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;margin-top:9px}.personal-row select,.personal-row input,.personal-row textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.personal-row textarea{min-height:70px}
.notice{padding:12px 14px;border-radius:13px;background:#fff7df;color:#72540a;border:1px solid #f1df9e;font-size:13px;margin-bottom:14px}
@media(max-width:1050px){.app{grid-template-columns:82px 1fr}.brand .brand-copy,.nav .nav-text,.sidebar-foot{display:none}.nav button{text-align:center}.nav .ico{width:auto}.kpis{grid-template-columns:repeat(2,1fr)}.two,.profile-grid{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.sidebar{height:auto;position:static;display:block;padding:12px}.brand{padding:0 0 10px}.brand .brand-copy{display:block}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.nav .nav-text{display:inline}.main{padding:18px 14px}.topbar{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:1fr 1fr}.form-grid,.detail-grid{grid-template-columns:1fr}.date-group{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(5,260px)}.personal-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">TY</div><div class="brand-copy"><h1>2027 求职雷达</h1><small>个人版 · V3</small></div></div>
  <nav class="nav">
    <button class="active" data-view="dashboard"><span class="ico">⌂</span><span class="nav-text">Dashboard</span></button>
    <button data-view="jobs"><span class="ico">▦</span><span class="nav-text">岗位库</span></button>
    <button data-view="pipeline"><span class="ico">⇢</span><span class="nav-text">投递进度</span></button>
    <button data-view="calendar"><span class="ico">◫</span><span class="nav-text">截止日历</span></button>
    <button data-view="rules"><span class="ico">⚙</span><span class="nav-text">我的规则</span></button>
  </nav>
  <div class="sidebar-foot">自动岗位事实、每日导入更新与个人状态分离。个人状态、备注、投递日期和手动岗位均保存在浏览器本地。</div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="title"><h2 id="viewTitle">今日求职看板</h2><p id="todayText"></p></div>
    <div class="actions">
      <button class="btn" id="exportBtn">导出个人备份</button>
      <button class="btn" id="importBtn">导入个人备份</button>
      <input id="importFile" type="file" accept="application/json" hidden>
      <button class="btn update" id="importUpdatesBtn">导入岗位更新</button>
      <input id="importUpdatesFile" type="file" accept="application/json,.json" hidden>
      <button class="btn primary" id="addBtn">+ 我自己加岗位</button>
    </div>
  </div>

  <div class="syncbar">
    <span id="syncBadge" class="badge gray">正在读取岗位源</span>
    <span id="syncText" class="muted">jobs.json</span>
    <span id="localUpdateBadge" class="badge cyan">本地更新 0 条</span>
    <span class="spacer"></span>
    <button class="btn" id="refreshBtn">刷新自动岗位</button>
  </div>

  <section id="dashboard" class="view active">
    <div class="grid kpis" id="kpis"></div>
    <div class="grid two">
      <div class="card section">
        <div class="section-head"><h3>优先行动</h3><span class="muted" style="font-size:12px">仅待投 / 冲刺</span></div>
        <div id="urgentList" class="urgent-list"></div>
      </div>
      <div class="card section"><h3>当前策略</h3><div id="strategySummary" class="rule-list"></div></div>
    </div>
    <div class="card section" style="margin-top:16px">
      <div class="section-head"><h3>最近操作</h3><span class="muted" style="font-size:12px">状态更新、手动新增、岗位导入</span></div>
      <div id="activityList" class="activity-list"></div>
    </div>
  </section>

  <section id="jobs" class="view">
    <div class="toolbar">
      <input id="searchInput" placeholder="搜索公司、岗位、地点、专业、备注…">
      <select id="statusFilter"><option value="">全部状态</option></select>
      <select id="regionFilter"><option value="">全部地域</option><option value="重庆">重庆</option><option value="成都武汉长沙">成都 / 武汉 / 长沙</option><option value="四川湖北湖南其他">川 / 鄂 / 湘其他</option></select>
      <select id="sourceFilter"><option value="">全部来源</option><option value="自动">自动雷达</option><option value="手动">我自己加的</option></select>
      <select id="scoreFilter"><option value="0">全部推荐度</option><option value="8">8分以上</option><option value="7">7分以上</option><option value="6">6分以上</option></select>
      <select id="deadlineFilter"><option value="0">全部截止</option><option value="3">3天内</option><option value="7">7天内</option><option value="14">14天内</option></select>
    </div>
    <div class="card table-wrap">
      <table class="jobs-table">
        <thead><tr><th>公司 / 岗位</th><th>地点</th><th>地域</th><th>专业</th><th>学历</th><th>院校门槛</th><th>截止</th><th>推荐度</th><th>状态</th><th>来源</th></tr></thead>
        <tbody id="jobsBody"></tbody>
      </table>
    </div>
  </section>

  <section id="pipeline" class="view"><div id="pipelineBoard" class="pipeline"></div></section>
  <section id="calendar" class="view"><div id="calendarList" class="calendar"></div></section>

  <section id="rules" class="view">
    <div class="grid profile-grid">
      <div class="card rule-box"><h3>我的求职画像</h3><div id="profileCards" class="rule-list"></div></div>
      <div class="card rule-box"><h3>筛选规则</h3><textarea id="rulesText"></textarea><div class="modal-actions"><button id="saveRules" class="btn primary">保存规则</button></div></div>
    </div>
  </section>
</main>
</div>

<div class="modal" id="manualModal">
  <div class="modal-card">
    <div class="modal-head"><h3 id="manualTitle">我自己加岗位</h3><button class="close" data-close-manual>×</button></div>
    <form id="manualForm">
      <input type="hidden" id="manualId">
      <div class="form-grid">
        <div class="field"><label>公司</label><input id="mCompany" required></div>
        <div class="field"><label>岗位</label><input id="mRole" required></div>
        <div class="field"><label>地点</label><input id="mLocation"></div>
        <div class="field"><label>地域优先级</label><select id="mRegion"><option>重庆</option><option>成都武汉长沙</option><option>四川湖北湖南其他</option></select></div>
        <div class="field"><label>状态</label><select id="mStatus"></select></div>
        <div class="field"><label>推荐度</label><input id="mScore" type="number" min="0" max="10" step="0.1" value="7"></div>
        <div class="field"><label>专业要求</label><input id="mMajor"></div>
        <div class="field"><label>学历要求</label><input id="mDegree"></div>
        <div class="field"><label>院校门槛</label><input id="mSchool"></div>
        <div class="field"><label>截止日期</label><input id="mDeadline" type="datetime-local"></div>
        <div class="field full"><label>官网</label><input id="mUrl"></div>
        <div class="field full"><label>匹配理由</label><textarea id="mReason"></textarea></div>
        <div class="field full"><label>风险</label><textarea id="mRisk"></textarea></div>
        <div class="field full"><label>我的备注</label><textarea id="mNotes"></textarea></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="manualDelete" style="margin-right:auto;display:none">删除</button>
        <button type="button" class="btn" data-close-manual>取消</button>
        <button class="btn primary" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="detailModal">
  <div class="modal-card">
    <div class="modal-head"><h3 id="detailTitle"></h3><button class="close" data-close-detail>×</button></div>
    <div id="detailContent"></div>
    <div class="modal-actions">
      <button class="btn" data-close-detail>关闭</button>
      <button class="btn" id="editManualFromDetail" style="display:none">编辑完整岗位</button>
    </div>
  </div>
</div>

<script>
const PERSONAL_KEY='tao-job-dashboard-v2-personal';
const JOB_UPDATES_KEY='tao-job-dashboard-v3-job-updates';
const STATUS=['待投','已投','测评','笔试','面试','Offer','拒绝','排除','冲刺'];
const PIPELINE=['待投','已投','测评/笔试','面试','Offer'];
const ACTIONABLE_STATUS=new Set(['待投','冲刺']);

const DEFAULT_RULES=`地域优先级：
1. 重庆
2. 成都 / 武汉 / 长沙
3. 四川 / 湖北 / 湖南其他城市

筛选优先级：
1. 现实录用可能
2. 地域
3. 平台与发展
4. 专业匹配

排除传统土建施工单位、长期驻场施工类岗位。
明确限定985/211/双一流等不满足硬门槛的岗位不进入主推荐。
结构/力学、Abaqus、工程试验检测、Python、计算机视觉、结构健康监测作为加分项。

已知：
- 招商局全重科技：已投，后续仅跟踪招聘进度。`;

const DEFAULT_PERSONAL={
  profile:{
    name:'Tao',
    bachelor:'西安建筑科技大学 · 土木工程',
    master:'青岛理工大学 · 土木工程（工学硕士）',
    region:'重庆 > 成都/武汉/长沙 > 四川/湖北/湖南其他',
    strategy:'现实录用可能 > 地域 > 平台发展 > 专业匹配'
  },
  rules:DEFAULT_RULES,
  overrides:{
    'auto-cmheavy-bridge-impact':{
      status:'已投',
      personalNotes:'已投递，后续关注笔试、面试和补充材料。',
      updatedAt:'2026-10-24'
    }
  },
  customJobs:[],
  activities:[
    {date:'2026-10-24',text:'招商局全重科技已投递。'},
    {date:'2026-10-28',text:'求职网站采用自动岗位与个人操作分离。'}
  ]
};

const FALLBACK_PUBLIC={schema_version:2,generated_at:null,source:'本地兜底',jobs:[]};

let personal=loadPersonal();
let importedUpdates=loadImportedUpdates();
let basePublic=FALLBACK_PUBLIC;
let publicData=mergePublicSources(basePublic);
let jobs=[];
let selectedId=null;
let currentView='dashboard';

function clone(x){return JSON.parse(JSON.stringify(x))}

function loadPersonal(){
  try{
    const raw=localStorage.getItem(PERSONAL_KEY);
    if(!raw)return clone(DEFAULT_PERSONAL);
    const d=JSON.parse(raw);
    return {
      ...clone(DEFAULT_PERSONAL),
      ...d,
      profile:{...clone(DEFAULT_PERSONAL.profile),...(d.profile||{})},
      overrides:{...clone(DEFAULT_PERSONAL.overrides),...(d.overrides||{})},
      customJobs:Array.isArray(d.customJobs)?d.customJobs:[],
      activities:Array.isArray(d.activities)?d.activities:[]
    };
  }catch(e){return clone(DEFAULT_PERSONAL)}
}
function savePersonal(){
  localStorage.setItem(PERSONAL_KEY,JSON.stringify(personal));
  mergeJobs();
  renderAll();
}

function loadImportedUpdates(){
  try{
    const d=JSON.parse(localStorage.getItem(JOB_UPDATES_KEY)||'[]');
    return Array.isArray(d)?d:[];
  }catch(e){return []}
}
function saveImportedUpdates(){
  localStorage.setItem(JOB_UPDATES_KEY,JSON.stringify(importedUpdates));
  updateLocalUpdateBadge();
}
function updateLocalUpdateBadge(){
  const el=document.getElementById('localUpdateBadge');
  if(el)el.textContent=`本地更新 ${importedUpdates.length} 条`;
}

function normalizeText(v=''){
  return String(v??'').trim().toLowerCase().replace(/[\s·•\-—_()（）[\]【】]/g,'');
}
function normalizeLocation(v=''){
  return normalizeText(v).replace(/省|市/g,'');
}
function businessKey(j){
  return [normalizeText(j.company),normalizeText(j.job_title||j.role),normalizeLocation(j.location)].join('|');
}
function stableImportedId(j){
  const raw=businessKey(j)||String(Date.now());
  let h=2166136261;
  for(let i=0;i<raw.length;i++){
    h^=raw.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return 'import-'+(h>>>0).toString(36);
}
function existingIdForRecord(r){
  const key=businessKey(r);
  const all=[...(basePublic.jobs||[]),...importedUpdates];
  const found=all.find(x=>businessKey(x)===key);
  return found?.id||'';
}
function normalizeImportedRecord(r){
  if(!r||typeof r!=='object')throw new Error('存在非对象记录');
  if(!String(r.company||'').trim())throw new Error('存在缺少 company 的记录');
  if(!String(r.job_title||'').trim())throw new Error(`「${r.company}」缺少 job_title`);

  const candidate={...r};
  const id=String(r.id||existingIdForRecord(candidate)||stableImportedId(candidate));
  return {
    id,
    company:String(r.company||'').trim(),
    job_title:String(r.job_title||'').trim(),
    location:String(r.location||'').trim(),
    region_priority:String(r.region_priority||'').trim()||'其他 / 待定',
    job_type:String(r.job_type||'').trim(),
    major_requirement:String(r.major_requirement||'').trim(),
    degree_requirement:String(r.degree_requirement||'').trim(),
    school_requirement:String(r.school_requirement||'').trim(),

    deadline:r.deadline||'',
    days_left:r.days_left??null,
    urgency:r.urgency||'',
    recommendation_score_10:Number(r.recommendation_score_10)||0,
    default_status:STATUS.includes(r.status)?r.status:(STATUS.includes(r.default_status)?r.default_status:'待投'),
    match_reason:String(r.match_reason||'').trim(),
    risk_or_exclusion_reason:String(r.risk_or_exclusion_reason||'').trim(),
    official_url:String(r.official_url||'').trim(),
    source_urls:Array.isArray(r.source_urls)?r.source_urls:[],
    verified:r.verified||'每日JSON导入',
    last_verified_at:String(r.last_verified_at||new Date().toISOString().slice(0,10)),
    change_type:String(r.change_type||'新增'),
    change_summary:String(r.change_summary||'').trim()
  };
}
function mergePublicSources(base){
  const map=new Map();
  for(const j of (base.jobs||[]))map.set(j.id,{...j});
  for(const j of importedUpdates){
    const old=map.get(j.id)||{};
    map.set(j.id,{...old,...j});
  }
  return {...base,jobs:[...map.values()]};
}

async function importJobUpdates(file){
  const raw=JSON.parse(await file.text());
  const arr=Array.isArray(raw)?raw:(Array.isArray(raw.jobs)?raw.jobs:null);
  if(!arr)throw new Error('岗位更新必须是 JSON 数组，或包含 jobs 数组');
  if(!arr.length)throw new Error('JSON 中没有岗位记录');

  const current=mergePublicSources(basePublic).jobs||[];
  const currentById=new Map(current.map(j=>[j.id,j]));
  const importedById=new Map(importedUpdates.map(j=>[j.id,j]));
  let added=0,updated=0,skipped=0;

  for(const item of arr){
    try{
      const n=normalizeImportedRecord(item);
      const existed=currentById.has(n.id)||importedById.has(n.id);
      if(existed)updated++; else added++;
      const old=importedById.get(n.id)||currentById.get(n.id)||{};
      importedById.set(n.id,{...old,...n});
      currentById.set(n.id,{...old,...n});
    }catch(err){
      console.warn('跳过岗位记录',item,err);
      skipped++;
    }
  }
  importedUpdates=[...importedById.values()];
  saveImportedUpdates();
  publicData=mergePublicSources(basePublic);
  mergeJobs();
  addActivity(`导入岗位更新：新增 ${added}，更新 ${updated}，跳过 ${skipped}`);
  localStorage.setItem(PERSONAL_KEY,JSON.stringify(personal));
  renderAll();
  return {added,updated,skipped};
}

function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtDate(dt){
  if(!dt)return '未明确';
  const d=new Date(dt);if(Number.isNaN(d.getTime()))return dt;
  return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).replace('/','-');
}
function daysLeft(dt){
  if(!dt)return null;
  const d=new Date(dt);if(Number.isNaN(d.getTime()))return null;
  return Math.ceil((d-new Date())/86400000);
}
function urgency(dt){
  const n=daysLeft(dt);
  if(n===null)return{cls:'gray',text:'未明确'};
  if(n<0)return{cls:'gray',text:'已截止'};
  if(n<=3)return{cls:'red',text:`紧急 · ${n}天`};
  if(n<=7)return{cls:'amber',text:`临近 · ${n}天`};
  return{cls:'blue',text:`${n}天`};
}
function badgeStatus(s){
  const map={待投:'amber',已投:'blue',测评:'purple',笔试:'purple',面试:'green',Offer:'green',拒绝:'gray',排除:'gray',冲刺:'purple'};
  return `<span class="badge ${map[s]||'gray'}">${esc(s)}</span>`;
}
function badgeSource(s){return `<span class="badge ${s==='自动'?'cyan':'gray'}">${s==='自动'?'自动雷达':'手动'}</span>`}
function regionRank(v){return {'重庆':1,'成都武汉长沙':2,'四川湖北湖南其他':3}[v]||4}

function mergeJobs(){
  const autos=(publicData.jobs||[]).map(j=>{
    const o=personal.overrides[j.id]||{};
    return {
      id:j.id,source:'自动',company:j.company,role:j.job_title,location:j.location||'',
      region:j.region_priority||'其他 / 待定',jobType:j.job_type||'',major:j.major_requirement||'',
      degree:j.degree_requirement||'',schoolGate:j.school_requirement||'',otherHard:j.other_hard_requirements||'',
      deadline:j.deadline||'',score:+j.recommendation_score_10||0,
      status:o.status||j.default_status||j.status||'待投',
      verified:j.verified||'需复核',url:j.official_url||'',reason:j.match_reason||'',
      risk:j.risk_or_exclusion_reason||'',notes:o.personalNotes||'',appliedAt:o.appliedAt||'',
      lastVerified:j.last_verified_at||'',changeType:j.change_type||'',changeSummary:j.change_summary||'',
      sourceUrls:j.source_urls||[]
    };
  });
  const customs=(personal.customJobs||[]).map(j=>({...j,source:'手动'}));
  jobs=[...autos,...customs];
}

async function loadPublic(silent=false){
  const badge=document.getElementById('syncBadge'),text=document.getElementById('syncText');
  try{
    const r=await fetch('jobs.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!Array.isArray(d.jobs))throw new Error('数据格式错误');
    basePublic=d;
    publicData=mergePublicSources(basePublic);
    badge.className='badge green';badge.textContent='在线岗位源已连接';
    text.textContent=`线上源：${d.generated_at?new Date(d.generated_at).toLocaleString('zh-CN'):'未标注时间'} · 本地导入 ${importedUpdates.length} 条`;
  }catch(e){
    basePublic=FALLBACK_PUBLIC;
    publicData=mergePublicSources(basePublic);
    badge.className='badge amber';badge.textContent='本地导入模式';
    text.textContent=location.protocol==='file:'?'当前以本地文件打开；岗位更新仍可通过“导入岗位更新”使用。':'线上 jobs.json 读取失败；已使用本地导入数据：'+e.message;
    if(!silent)console.warn(e);
  }
  mergeJobs();renderAll();updateLocalUpdateBadge();
}

function renderJobs(){

  const arr=jobs.filter(j=>{
    const hay=[j.company,j.role,j.location,j.region,j.major,j.reason,j.risk,j.notes].join(' ').toLowerCase();
    if(q&&!hay.includes(q))return false;if(sf&&j.status!==sf)return false;if(rf&&j.region!==rf)return false;if(src&&j.source!==src)return false;
    if(score&&j.score<score)return false;

}

};

document.getElementById('exportBtn').onclick=()=>{
  const payload={schema_version:2,exported_at:new Date().toISOString(),personal};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='tao_job_personal_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById('importBtn').onclick=()=>importFile.click();
document.getElementById('importFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(!d.personal)throw new Error('不是 V2 个人备份');
    personal=d.personal;savePersonal();alert('个人数据导入成功');
  }catch(err){alert('导入失败：'+err.message)}
  e.target.value='';
};

document.getElementById('importUpdatesBtn').onclick=()=>importUpdatesFile.click();
document.getElementById('importUpdatesFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const {added,updated,skipped}=await importJobUpdates(f);
    alert(`岗位更新导入成功\n新增：${added}\n更新：${updated}\n跳过：${skipped}\n\n个人状态、备注和投递日期均已保留。`);
  }catch(err){
    alert('岗位更新导入失败：'+err.message);
  }
  e.target.value='';
};

window.showDetail=showDetail;
window.saveDetailPersonal=saveDetailPersonal;

mergeJobs();
renderAll();
updateLocalUpdateBadge();
loadPublic(true);
</script>
</body>
</html>
